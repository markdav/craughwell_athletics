name: Send Athletics Report Email

on:
  push:
    branches:
      - main

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new markdown report in PRO_Reports
        id: find_report
        run: |
          new_file=$(git diff --name-only HEAD~1 HEAD | grep -E '^PRO_Reports/[0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true)
          if [ -z "$new_file" ]; then
            echo "No new report file found — skipping."
            exit 0
          fi
          echo "new_file=$new_file" >> $GITHUB_OUTPUT
          echo "Found report: $new_file"

      - name: Prepare email body and attachments
        id: build_email
        if: steps.find_report.outputs.new_file != ''
        run: |
          REPORT_FILE="${{ steps.find_report.outputs.new_file }}"
          TEMPLATE_FILE="PRO_Reports/mail-template.md"

          # Merge template with report
          if [ -f "$TEMPLATE_FILE" ]; then
            sed '/REPORT_CONTENT/r '"$REPORT_FILE"'' "$TEMPLATE_FILE" | sed '/REPORT_CONTENT/d' > combined.md
          else
            cp "$REPORT_FILE" combined.md
          fi

          # Convert markdown to simple HTML (preserve line breaks)
          awk '{print $0 "<br>"}' combined.md > combined.html

          # Parse ![[image.jpg]] references for attachments
          images=$(grep -oP '!\[\[(.*?)\]\]' "$REPORT_FILE" | sed -E 's/!\[\[(.*)\]\]/\1/')
          image_list=""
          for img in $images; do
            image_path="$(dirname "$REPORT_FILE")/$img"
            if [ -f "$image_path" ]; then
              b64=$(base64 -w 0 "$image_path")
              filename=$(basename "$image_path")
              image_list="${image_list}{\"filename\":\"$filename\",\"content\":\"$b64\"},"
            else
              echo "WARNING: Image not found: $image_path"
            fi
          done
          image_list="[${image_list%,}]"

          echo "attachments=$image_list" >> $GITHUB_OUTPUT

          # Write HTML body to output
          echo "email_body<<EOF" >> $GITHUB_OUTPUT
          cat combined.html >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send report via Resend
        if: steps.find_report.outputs.new_file != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          body=$(jq -n \
            --arg from 'Craughwell AC Reports <onboarding@resend.dev>' \
            --argjson to '["mark.davis2@gmail.com","mark.davis2@hpe.com"]' \
            --arg subject "Weekly Athletics Report" \
            --arg html "${{ steps.build_email.outputs.email_body }}" \
            --argjson attachments "${{ steps.build_email.outputs.attachments }}" \
            '{from:$from, to:$to, subject:$subject, html:$html, attachments:$attachments}')

          echo "Sending email..."
          curl -s -o response.txt -w "%{http_code}" \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body"

          echo "Response:"
          cat response.txt
