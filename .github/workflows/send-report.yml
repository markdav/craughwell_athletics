name: Send Athletics Report Email

on:
  push:
    branches:
      - main

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the new markdown report file (in PRO_Reports)
        id: find_report
        run: |
          new_file=$(git diff --name-only HEAD~1 HEAD | grep -E '^PRO_Reports/[0-9]{4}-[0-9]{2}-[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true)
          if [ -z "$new_file" ]; then
            echo "No new report file found in PRO_Reports — skipping."
            exit 0
          fi
          echo "new_file=$new_file" >> $GITHUB_OUTPUT
          echo "Found report: $new_file"

      - name: Parse markdown for image references
        id: parse_images
        if: steps.find_report.outputs.new_file != ''
        run: |
          report_file="${{ steps.find_report.outputs.new_file }}"
          images=$(grep -oP '!\\[\\[(.*?)\\]\\]' "$report_file" | sed -E 's/!\[\[(.*)\]\]/\1/' | xargs)
          image_list=""
          for img in $images; do
            image_path="$(dirname "$report_file")/$img"
            if [ -f "$image_path" ]; then
              # Base64 encode attachments for Resend
              b64=$(base64 -w 0 "$image_path")
              filename=$(basename "$image_path")
              image_list="${image_list}{\"filename\":\"$filename\",\"content\":\"$b64\"},"
            fi
          done
          image_list="[${image_list%,}]"
          echo "attachments=$image_list" >> $GITHUB_OUTPUT
          echo "Found attachments: $image_list"

      - name: Read markdown content
        id: read_markdown
        if: steps.find_report.outputs.new_file != ''
        run: |
          content=$(cat "${{ steps.find_report.outputs.new_file }}")
          # Escape quotes and newlines for JSON
          content_json=$(echo "$content" | jq -Rs .)
          echo "content=$content_json" >> $GITHUB_OUTPUT

      - name: Prepare email body
        id: build_email
        run: |
          REPORT_FILE="${{ steps.find_report.outputs.new_file }}"
          TEMPLATE_FILE="PRO_Reports/mail-template.md"

          if [ -f "$TEMPLATE_FILE" ]; then
            sed '/REPORT GOES HERE/r '"$REPORT_FILE"'' "$TEMPLATE_FILE" | sed '/REPORT GOES HERE/d' > combined.md
          else
            cp "$REPORT_FILE" combined.md
          fi

          {
            echo "email_body<<EOF"
            cat combined.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send report email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          body=$(jq -n \
            --arg from 'Craughwell AC Reports <onboarding@resend.dev>' \
            --arg to 'mark.davis2@gmail.com,mark.davis2@hpe.com' \
            --arg subject 'Weekly Athletics Report' \
            --arg html "$(jq -Rs . < combined.md | jq -r .)" \
            '{from:$from, to:$to, subject:$subject, html:$html}')

          echo "Sending email..."
          curl -s -o response.txt -w "%{http_code}" \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$body"

          echo "Response:"
          cat response.txt